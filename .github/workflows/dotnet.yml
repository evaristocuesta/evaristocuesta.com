name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:    

permissions:
  contents: read
  pages: write
  id-token: write    

jobs:
  ci-build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./evaristocuesta.com
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./evaristocuesta.com

    - name: Generate pages
      run: dotnet run --launch-profile "Production" --no-restore --configuration Release ssg ../../web     
      working-directory: ./evaristocuesta.com

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'web'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4      
