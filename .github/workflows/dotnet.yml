name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:    

permissions:
  contents: read
  pages: write
  id-token: write    

jobs:
  ci-build:

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./evaristocuesta.com
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./evaristocuesta.com

    - name: Publish
      run: dotnet publish --no-restore --configuration Release --output ./bin/publish
      working-directory: ./evaristocuesta.com

    - name: Generate pages
      # Run the published app so build-time generated assets (scoped CSS -> evaristocuesta.com.styles.css)
      # are present when AspNetStatic generates the static site.
      run: dotnet ./bin/publish/evaristocuesta.com.dll ssg ${{ github.workspace }}/web evaristocuesta.com
      working-directory: ./evaristocuesta.com      

    - name: Show generated files 
      run: ls -laR ${{ github.workspace }}/web || true

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'web/evaristocuesta.com'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4      
